name: Release

# Pushing a v* tag builds Orange-<version>.zip and Orange-<version>-bundle.zip on Windows (so the
# compiled orangeArray.mll is included) and publishes them as a GitHub Release. Release notes come
# from docs/releases/<tag>.md when that file exists.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: python -m pip install "PySide6-Essentials>=6.5,<6.9"
      - name: Read the package version
        id: version
        shell: bash
        run: |
          VER="$(python - <<'EOF'
          import io, re
          text = io.open('blender_kontrol/__init__.py', encoding='utf-8').read()
          print(re.search(r"^__version__\s*=\s*'([^']+)'", text, re.M).group(1))
          EOF
          )"
          TAG="${{ inputs.tag || github.ref_name }}"
          if [ "v$VER" != "$TAG" ]; then
            echo "tag $TAG does not match __version__ $VER"
            exit 1
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Build packages
        run: python tools/build_release.py
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.version.outputs.ver }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ASSETS="dist/Orange-$VER.zip dist/Orange-$VER-bundle.zip"
          NOTES="docs/releases/$TAG.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ASSETS --clobber
            if [ -f "$NOTES" ]; then
              gh release edit "$TAG" --title "Orange $VER" --notes-file "$NOTES"
            fi
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" $ASSETS --title "Orange $VER" --notes-file "$NOTES"
          else
            gh release create "$TAG" $ASSETS --title "Orange $VER" --generate-notes
          fi
